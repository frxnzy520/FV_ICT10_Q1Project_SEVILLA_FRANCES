<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKU Generator</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffdefb, #f9ffdf);
        }

        .topbar {
            height: 45px;
            background-color: #d2e8ff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;
        }

        .brand {
            font-size: 14px;
            font-weight: bold;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            margin-left: 22px;
        }

        .page {
            min-height: calc(100vh - 45px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .card {
            width: 430px;
            background-color: white;

            border-radius: 14px;
            overflow: hidden;

            box-shadow: 0 12px 30px rgb(255, 188, 188);
        }

        .header {
            background: linear-gradient(100deg, #dfeeff, #dfc7ff);
            color: rgb(255, 144, 144);

            text-align: center;
            padding: 25px 20px;
        }

        .header h1 {
            margin: 5px 0;
            font-size: 24px;
        }

        .content {
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;

            color: #eb9c9c;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;

            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        button {
            width: 100%;

            border: none;
            border-radius: 7px;

            padding: 11px;
            margin-top: 20px;

            background: linear-gradient(100deg, #aed3ff, #d8baff);
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;

            border-top: 1px solid #ddd;

            color: #555;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <header class="topbar">

        <div class="brand">
            ☕ Love and Hearts Cafe
        </div>

        <nav class="nav">
            <a href="sku.html">▥ SKU Generator</a>
            <a href="index.html">ⓘ Receipt Generator</a>
        </nav>

    </header>


    <main class="page">

        <div class="card">

            <div class="header">
                <h1>SKU Generator</h1>
                <p>Love and Hearts Cafe</p>
            </div>

            <div class="content">

                <label>Category</label>
                <input type="text" id="category"
                       placeholder="Example: Coffee">

                <label>Product Name</label>
                <input type="text" id="product"
                       placeholder="Example: Love-lock Cheesecake">

                <label>Stock Quantity</label>
                <input type="number" id="quantity"
                       placeholder="Example: 10">

                <button py-click="generate_sku">
                    Generate SKU
                </button>

                <div id="result" class="result">
                    Your SKU will appear here.
                </div>

            </div>

        </div>

    </main>


    <py-script src="main.py"></py-script>

</body>
</html>
