<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receipt Generator</title>

   
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.7.3/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffdefb, #f9ffdf);
        }

        
        .topbar {
            height: 45px;
            background-color: #d2e8ff;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;
        }

        .brand {
            font-size: 14px;
            font-weight: bold;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            margin-left: 22px;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        
        .page {
            min-height: calc(100vh - 45px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        
        .receipt {
            width: 430px;
            background-color: white;

            border-radius: 14px;
            overflow: hidden;

            box-shadow: 0 12px 30px rgb(255, 188, 188);
        }

        
        .receipt-header {
            background: linear-gradient(100deg, #dfeeff, #dfc7ff);
            color: rgb(255, 144, 144);

            text-align: center;
            padding: 25px 20px;
        }

        .coffee-icon {
            font-size: 28px;
        }

        .receipt-header h1 {
            margin: 5px 0;
            font-size: 24px;
        }

        .subtitle {
            margin: 0;
            font-size: 12px;
            opacity: 0.8;
        }

        
        .content {
            padding: 18px;
        }

        .content h2 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #f1adad;
        }

        
        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;

            border: 1px solid #e5e5e5;
            border-radius: 8px;

            padding: 11px;
            margin-bottom: 7px;

            color: #eb9c9c;
            font-size: 13px;
        }

        .item:hover {
            background-color: #e0e7ff;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item input {
            cursor: pointer;
        }

        .price {
            color: #b06666;
            font-weight: bold;
        }

        
        button {
            width: 100%;

            border: none;
            border-radius: 7px;

            padding: 11px;
            margin-top: 8px;

            background: linear-gradient(100deg, #aed3ff, #d8baff);
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

       
        .receipt-display {
            border-top: 1px solid #ddd;

            margin-top: 15px;
            padding-top: 15px;

            min-height: 100px;

            color: #555;
            font-size: 13px;
            line-height: 1.7;
        }

        .receipt-title {
            color: #333;
            font-weight: bold;
        }
    </style>
</head>

<body>

    
    <header class="topbar">

        <div class="brand">
            ☕
            Love and Hearts Cafe 
        </div>

        <nav class="nav">
            <a href="sku.html">▥ SKU Generator</a>
            <a href="index.html">ⓘ Receipt Generator</a>
        </nav>

    </header>


    
    <main class="page">

        <div class="receipt">

            
            <div class="receipt-header">

                <div class="coffee-icon">
                    ~☕~
                </div>

                <h1>
                    Receipt of Love and Hearts Cafe
                </h1>

                <p class="subtitle">
                    Owned by your cupid Frances Sevilla
                </p>

            </div>


            
            <div class="content">

                <h2>
                    ☷ Choose Your Items
                </h2>


                <label class="item">

                    <span class="item-left">
                        <input type="checkbox" id="cake">
                        Love-lock Cheesecake
                    </span>

                    <span class="price">
                        ₱180
                    </span>

                </label>


                <label class="item">

                    <span class="item-left">
                        <input type="checkbox" id="donut">
                        Tongue-twister Sourdough Donut
                    </span>

                    <span class="price">
                        ₱50
                    </span>

                </label>


                <label class="item">

                    <span class="item-left">
                        <input type="checkbox" id="pizza">
                        The Romantic Cheezy Pizza
                    </span>

                    <span class="price">
                        ₱220
                    </span>

                </label>


                <label class="item">

                    <span class="item-left">
                        <input type="checkbox" id="cola">
                        Love-shot Cola
                    </span>

                    <span class="price">
                        ₱100
                    </span>

                </label>


                <label class="item">

                    <span class="item-left">
                        <input type="checkbox" id="icecream">
                        Soulmate Duo Ice Cream
                    </span>

                    <span class="price">
                        ₱120
                    </span>

                </label>


                
                <button py-click="generate_receipt">
                    ▣ Generate Receipt
                </button>


              
                <div id="result" class="receipt-display">

                    <span class="receipt-title">
                        Your Receipt
                    </span>

                    <br>

                    Select your items and click
                    "Generate Receipt".

                </div>

            </div>

        </div>

    </main>


    
    <py-script src="main.py"></py-script>

</body>
</html>
